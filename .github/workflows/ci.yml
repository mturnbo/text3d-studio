name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format github .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"  # the oldest version pyproject.toml allows
          - os: ubuntu-24.04
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # Xvfb gives Qt a display, and Mesa's software renderer (llvmpipe) gives it OpenGL 4.5 core,
      # so the GPU tests run instead of skipping.
      - name: Install a virtual display and software OpenGL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - run: uv sync --locked

      # Frame-rate tests measure the machine, not the code: they're left to local runs on real GPUs.
      # A test stuck for 2 minutes (a modal dialog, a driver) fails with its stack instead of stalling the job.
      - name: Test
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          args=(-q -k "not fps" -rs --timeout=120 --timeout-method=thread)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" uv run pytest "${args[@]}"
          else
            uv run pytest "${args[@]}"
          fi
