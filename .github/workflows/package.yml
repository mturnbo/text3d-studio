name: Package

# Builds standalone apps with Nuitka on each OS. Build options live in text3d_studio/__main__.py.
# A version tag (v*) also publishes the three builds as a GitHub release.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/package.yml"
      - "text3d_studio/__main__.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04  # the oldest supported glibc, so the binary runs on more distributions
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Linux build and runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv sync --group build --no-dev
          uv run --no-sync python -m nuitka text3d_studio \
            --product-version="$VERSION" --file-version="$VERSION" --macos-app-version="$VERSION"

      - name: Collect the build
        id: collect
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="text3d-studio-$VERSION-${{ matrix.name }}"
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              ditto -c -k --keepParent build/text3d_studio.app "dist/$name.zip"
              echo "binary=build/text3d_studio.app/Contents/MacOS/text3d-studio" >> "$GITHUB_OUTPUT" ;;
            Windows)
              cp build/text3d-studio.exe "dist/$name.exe"
              echo "binary=build/text3d-studio.exe" >> "$GITHUB_OUTPUT" ;;
            Linux)
              cp build/text3d-studio "dist/$name"
              echo "binary=build/text3d-studio" >> "$GITHUB_OUTPUT" ;;
          esac
          ls -la dist

      # Catches a bundle missing a module or library: those fail at startup. Offscreen, as runners have no display.
      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          BINARY: ${{ steps.collect.outputs.binary }}
        run: |
          "$BINARY" &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 30 s"
            kill "$pid"
          else
            wait "$pid"; status=$?
            echo "Exited during startup with status $status"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: text3d-studio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
