[project]
name = "text3d-studio"
version = "0.2.0"
description = "Desktop app for compositing layer-stacked 3D text into photographs"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26",
]

[project.scripts]
text3d-studio = "text3d_studio.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
